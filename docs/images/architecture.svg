<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RealtimeShop Analytics Architecture</title>
  <desc id="desc">OLTP to OLAP real-time analytics pipeline using Spring Boot, PostgreSQL, Debezium, Kafka, ClickHouse, Kafka UI, and Grafana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #60a5fa; }
      .box-green { fill: #ecfdf5; stroke: #34d399; }
      .box-orange { fill: #fff7ed; stroke: #fb923c; }
      .box-purple { fill: #f5f3ff; stroke: #a78bfa; }
      .box-dark { fill: #0f172a; stroke: #334155; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .dark-label { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .dark-small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .note { font: 700 13px Arial, sans-serif; fill: #1d4ed8; }
      .pill { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 12; }
      .pill-text { font: 700 12px Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="64" y="62" class="title">RealtimeShop Analytics</text>
  <text x="64" y="91" class="subtitle">Real-time OLTP to OLAP pipeline with CDC, Kafka streaming, ClickHouse analytics, and Grafana dashboards.</text>

  <rect x="64" y="140" width="210" height="110" class="box box-blue"/>
  <text x="88" y="178" class="label">Spring Boot</text>
  <text x="88" y="204" class="small">Data Generator</text>
  <text x="88" y="228" class="small">orders, payments, stock</text>

  <rect x="354" y="140" width="210" height="110" class="box box-green"/>
  <text x="378" y="178" class="label">PostgreSQL</text>
  <text x="378" y="204" class="small">OLTP source of truth</text>
  <text x="378" y="228" class="small">logical WAL replication</text>

  <rect x="644" y="140" width="210" height="110" class="box box-orange"/>
  <text x="668" y="178" class="label">Debezium</text>
  <text x="668" y="204" class="small">Kafka Connect source</text>
  <text x="668" y="228" class="small">captures c, u, d events</text>

  <rect x="934" y="140" width="210" height="110" class="box box-purple"/>
  <text x="958" y="178" class="label">Kafka</text>
  <text x="958" y="204" class="small">CDC event backbone</text>
  <text x="958" y="228" class="small">shop.public.* topics</text>

  <path d="M274 195 L344 195" class="arrow"/>
  <path d="M564 195 L634 195" class="arrow"/>
  <path d="M854 195 L924 195" class="arrow"/>

  <text x="286" y="177" class="note">INSERT / UPDATE / DELETE</text>
  <text x="585" y="177" class="note">WAL</text>
  <text x="872" y="177" class="note">events</text>

  <rect x="934" y="322" width="210" height="110" class="box box-blue"/>
  <text x="958" y="360" class="label">Kafka UI</text>
  <text x="958" y="386" class="small">topic inspection</text>
  <text x="958" y="410" class="small">connector and lag checks</text>

  <rect x="644" y="322" width="210" height="110" class="box box-green"/>
  <text x="668" y="360" class="label">ClickHouse Raw</text>
  <text x="668" y="386" class="small">Kafka Engine tables</text>
  <text x="668" y="410" class="small">JSON CDC ingestion</text>

  <rect x="354" y="322" width="210" height="110" class="box box-orange"/>
  <text x="378" y="360" class="label">Materialized Views</text>
  <text x="378" y="386" class="small">parse Debezium payload</text>
  <text x="378" y="410" class="small">write fact, dim, agg</text>

  <rect x="64" y="322" width="210" height="110" class="box box-purple"/>
  <text x="88" y="360" class="label">ClickHouse OLAP</text>
  <text x="88" y="386" class="small">fact_orders, payments</text>
  <text x="88" y="410" class="small">dim, agg, history tables</text>

  <path d="M1039 250 L1039 312" class="arrow"/>
  <path d="M934 377 L864 377" class="arrow"/>
  <path d="M644 377 L574 377" class="arrow"/>
  <path d="M354 377 L284 377" class="arrow"/>

  <text x="1060" y="288" class="note">observe</text>
  <text x="872" y="360" class="note">consume</text>
  <text x="585" y="360" class="note">transform</text>
  <text x="292" y="360" class="note">store</text>

  <rect x="64" y="505" width="1080" height="110" class="box box-dark"/>
  <text x="92" y="545" class="dark-label">Grafana Dashboards</text>
  <text x="92" y="574" class="dark-small">RealtimeShop Overview + ClickHouse Analytics Features: streaming, funnel, distribution, pre-aggregation, and time travel.</text>

  <path d="M169 432 L169 495" class="arrow"/>
  <text x="190" y="468" class="note">SQL datasource</text>

  <rect x="530" y="638" width="110" height="28" class="pill"/>
  <text x="549" y="657" class="pill-text">Docker Compose</text>
  <rect x="655" y="638" width="120" height="28" class="pill"/>
  <text x="675" y="657" class="pill-text">Near real-time</text>
  <rect x="790" y="638" width="150" height="28" class="pill"/>
  <text x="809" y="657" class="pill-text">Production-minded</text>
</svg>
