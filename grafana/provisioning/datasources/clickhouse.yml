apiVersion: 1

datasources:
  - name: ClickHouse Analytics
    uid: clickhouse-analytics
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      server: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: analytics
      username: clickhouse
      tlsSkipVerify: true
    secureJsonData:
      password: clickhouse
